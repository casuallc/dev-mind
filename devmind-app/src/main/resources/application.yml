server:
  port: 8080

spring:
  application:
    name: devmind
  profiles:
    default: local          # 默认激活 local：本机专属配置放 application-local.yml（已 gitignore），未建则用仓库默认值
  datasource:
    url: jdbc:h2:file:./data/devmind;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # 切 MySQL（驱动已随包携带）：在 application-local.yml 覆盖以下四项即可
    #   url: jdbc:mysql://host:3306/devmind?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    #   driver-class-name: com.mysql.cj.jdbc.Driver
    #   username: ...
    #   password: ...
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 64MB        # CAP-21 FR-09 runner shaded jar 上传（Boot 默认 1MB 必超限）
      max-request-size: 64MB

devmind:
  cors:
    # CORS / WebSocket 握手来源白名单（REST 过滤器与 WS 握手同口径）。
    # 默认本地开发来源；联调/分离部署时在 application-local.yml 覆盖追加（整表替换，默认值需一并带上），
    # 如：devmind.cors.allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://<前端机IP>:5173
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
  auth:
    jwt-secret: ""                 # JWT HS256 密钥；空=自动生成存 data/auth.key（gitignored）
    admin-password: admin123       # 仅首次种子 admin 时读取；请登录后立即修改
    access-ttl: 2h                 # access token 有效期
    refresh-ttl: 14d               # refresh token 有效期
  session:
    # CAP-34：服务端零执行，executor/claude-path 已删除——claude 二进制解析在 runner 侧 agent.properties
    model: ""
    permission-mode: acceptEdits   # 放手模式；会话级可覆盖
    input-timeout: 300
    idle-timeout: 0
    ring-buffer: 1000
    event-flush-ms: 200
    max-concurrent: 4
    oneshot-permission-mode: plan    # CAP-28 one-shot 总结会话专用（只读任务，不复用上方 acceptEdits）
  attachment:                      # CAP-32 公共附件管理
    root-dir: ""                   # 空=${user.dir}/data/attachments
    max-size-mb: 20                # 单附件上限（同时受 spring.servlet.multipart 64MB 约束）
  worklog:                         # CAP-28 个人工时
    daily-enabled: true
    daily-cron: "0 30 18 * * *"    # 每日 18:30 生成日报草稿
    weekly-enabled: true
    weekly-cron: "0 0 9 * * MON"   # 周一 09:00 生成上周周报草稿
    git-scan-max-commits: 200      # 单库单日扫描上限
    oneshot-timeout-seconds: 300
  worktree:
    root: ""                       # 空=项目内 .devmind/worktrees
    base-branch: master
  knowledge:
    repo-path: ""                  # 填 knowledge-repo 本地路径后可启用注入
    enabled: true
  docs:
    repo-path: ""                  # 填 docs-repo 本地 git 仓库路径（本机路径写 application-local.yml）
    enabled: true
  project:
    default-path: ""               # 留空：本机路径写在 application-local.yml（DEVMIND_PROJECT_DEFAULT_PATH 亦可覆盖）
    default-name: "default"
    default-tags: []
    workspace-root: "data/repositories"   # CAP-23 克隆工作区根目录：仓库克隆到 <root>/<projectId>/<repo子目录>
  server-adapter:
    crypto-key: ""                 # 凭证加密密钥；空=自动生成存 data/server-crypto.key（gitignored）
    connect-timeout-ms: 15000
    audit-enabled: true
  execution:                     # P0-1 统一执行底座（build/deploy/test/release 共用）
    shell: bash                    # 本地执行 shell（Windows 下为 Git Bash）
    step-timeout-ms: 1800000       # 单步超时 30 分钟，超时 kill
  build:
    default-concurrency: 1         # 新建构建配置的默认并发上限
