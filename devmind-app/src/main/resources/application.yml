server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true   # multipart 表单字段（如附件 description）按 UTF-8 解码——客户端未带 charset 时 Tomcat 默认 ISO-8859-1 会乱码
  compression:
    # 事件补拉/会话列表这类大 JSON（单页可到 MB 级）gzip 后约剩 1/10；小响应不值得压，2KB 起
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain,image/svg+xml
    min-response-size: 2KB

spring:
  application:
    name: devmind
  profiles:
    default: local          # 默认激活 local：本机专属配置放 application-local.yml（已 gitignore），未建则用仓库默认值
  datasource:
    url: jdbc:h2:file:./data/devmind;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # 切 MySQL（驱动已随包携带）：在 application-local.yml 覆盖以下四项即可
    #   url: jdbc:mysql://host:3306/devmind?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    #   driver-class-name: com.mysql.cj.jdbc.Driver
    #   username: ...
    #   password: ...
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 4GB           # CAP-57 分类安装包（模型权重 GB 级，流式落盘不过内存）；原 64MB 为 CAP-21 runner jar
      max-request-size: 4GB

devmind:
  error:
    include-stacktrace: false      # 错误响应体是否附带异常堆栈（ApiError.stackTrace）；仅本地排错用，在 application-local.yml 开 true，线上必须 false
  cors:
    # CORS / WebSocket 握手来源白名单（REST 过滤器与 WS 握手同口径）。
    # 默认本地开发来源；联调/分离部署时在 application-local.yml 覆盖追加（整表替换，默认值需一并带上），
    # 如：devmind.cors.allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://<前端机IP>:5173
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
  auth:
    jwt-secret: ""                 # JWT HS256 密钥；空=自动生成存 data/auth.key（gitignored）
    admin-password: admin123       # 仅首次种子 admin 时读取；请登录后立即修改
    access-ttl: 2h                 # access token 有效期
    refresh-ttl: 14d               # refresh token 有效期
  session:
    # CAP-34：服务端零执行，executor/claude-path 已删除——claude 二进制解析在 runner 侧 agent.properties
    model: ""
    permission-mode: acceptEdits   # 放手模式；会话级可覆盖
    input-timeout: 300
    idle-timeout: 0
    ring-buffer: 1000
    event-flush-ms: 200
    max-concurrent: 4
    oneshot-permission-mode: plan    # CAP-28 one-shot 总结会话专用（只读任务，不复用上方 acceptEdits）
  chat:                            # CAP-30 通用问答（此处只列常调项；其余键用代码默认值）
    # CAP-49 模型执行体（服务端直连已接入的 kind=CHAT 端点，不需要 runner 节点）
    max-concurrent-model: 8        # 并发生成上限；与 Agent 分账，只数"正在生成"的（空闲不占额度）
    stream-flush-ms: 120           # 增量合并窗口：攒够时间或字数才发一条 text_delta
    stream-flush-chars: 24
    answer-max-chars: 100000       # 单轮回答上限，超出截断并在 result 里标 truncated
  copilot:                         # CAP-76 平台智能体网关（此处只列常调项；其余键用代码默认值）
    enabled: false                 # 首次部署默认关闭；配置 CHAT 端点并在 /admin/copilot 健康检查通过后开启
    endpoint-id: ""                # 空=平台默认 CHAT 端点
    tool-mode: auto                # native | json | auto（auto=native 不支持工具时自动降级 json）
    max-steps: 8                   # 单轮最多模型回调轮数
    max-writes-per-turn: 3         # 单轮最多生成确认单数（超出要求用户分次）
    plan-max-steps: 5              # submit_plan 单计划最大步骤数（M7，FR-33）
    plan-execution-timeout-minutes: 120   # 计划异步执行整体上限（M8，FR-34）：sweep 判 EXECUTING 计划中断的阈值
    plan-await-poll-seconds: 10    # 步骤 await 作业终态的轮询间隔（FR-35；下限 5）
    plan-await-max-timeout-minutes: 120   # 单步 await.timeoutMinutes 上限（FR-35）
    turn-timeout-seconds: 180      # 单轮总时限，超时中止并回执
    confirm-ttl-minutes: 10        # 确认单有效期
    action-sweep-cron: "0 * * * * *"       # 分钟级状态收敛（PENDING→EXPIRED / 中断 EXECUTING→FAILED）；空=关闭
    cleanup-cron: "0 40 3 * * *"           # 每日审计保留期清理
    audit-retention-days: 180
  attachment:                      # CAP-32 公共附件管理
    root-dir: ""                   # 空=${user.dir}/data/attachments
    max-size-mb: 20                # 单附件上限（同时受 spring.servlet.multipart 64MB 约束）
  changelog:                       # CAP-87 控制台更新日志（只读本地文件，随安装包分发）
    path: ""                       # 空=user.dir/CHANGELOG.md → user.dir/config/CHANGELOG.md → classpath
    max-size-kb: 2048              # 单文件上限；超出 400 提示拆分
  worklog:                         # CAP-28 个人工时（CAP-41 起生成走 worklog 会话，one-shot 已摘除）
    schedule-cron: "0 * * * * *"   # 主 tick（每分钟）：逐用户判到期——个人执行时间（设置页）优先，未设跟随下列全局 cron
    daily-enabled: true
    daily-cron: "0 30 18 * * *"    # 全局兜底：每日 18:30 生成日报草稿
    weekly-enabled: true
    weekly-cron: "0 0 9 * * MON"   # 全局兜底：周一 09:00 生成上周周报草稿
    git-import-enabled: true       # FR-09 定时 Git 导入总开关（用户级仍需在设置页打开）
    git-import-cron: "0 0 18 * * *" # 全局兜底：每日 18:00 导入当日提交为条目（早于日报生成）
    git-scan-max-commits: 200      # 单库单日扫描上限
    repo-root: "./data/worklog/repos"  # CAP-89：仅作存量仓→DB 启动回迁的数据源（本机路径只走配置）；回迁完成后仓目录成死数据，可手工清理
  worktree:
    root: ""                       # 空=项目内 .devmind/worktrees
    base-branch: master
  verify:                          # CAP-73 需求开发中验证（此处只列常调项；超时等其余键用代码默认值）
    # 平台对外 HTTP 基址（如 https://devmind.example.com，勿带尾斜杠）——物化进会话工作区的
    # devmind-verify 助手脚本经它回连 /api/verify/trigger。空=不物化助手（人工触发不受影响）。
    # 反向代理/自签 https 部署必须显式配置，服务端无法自知公网地址。
    server-url: ""
    bundle-max-mb: 512             # 产物包上限，超限构建侧失败 VERIFY_BUNDLE_TOO_LARGE
    token-ttl-hours: 24            # agent 触发 token 有效期（绑会话+需求，过期 runner 重拉装配自动重签）
  knowledge:
    repo-path: ""                  # 填 knowledge-repo 本地路径后可启用注入
    enabled: true
  project:
    default-path: ""               # 留空：本机路径写在 application-local.yml（DEVMIND_PROJECT_DEFAULT_PATH 亦可覆盖）
    default-name: "default"
    default-tags: []
    workspace-root: "data/repositories"   # CAP-23 克隆工作区根目录：仓库克隆到 <root>/<projectId>/<repo子目录>
  execution:                     # P0-1 统一执行底座（build/deploy/test/release 共用）
    shell: bash                    # 本地执行 shell（Windows 下为 Git Bash）
    step-timeout-ms: 1800000       # 单步超时 30 分钟，超时 kill
  build:
    default-concurrency: 1         # 新建构建配置的默认并发上限
