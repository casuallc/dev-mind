server:
  port: 8080

spring:
  application:
    name: devmind
  profiles:
    default: local          # 默认激活 local：本机专属配置放 application-local.yml（已 gitignore），未建则用仓库默认值
  datasource:
    url: jdbc:h2:file:./data/devmind;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

devmind:
  auth:
    jwt-secret: ""                 # JWT HS256 密钥；空=自动生成存 data/auth.key（gitignored）
    admin-password: admin123       # 仅首次种子 admin 时读取；请登录后立即修改
    access-ttl: 2h                 # access token 有效期
    refresh-ttl: 14d               # refresh token 有效期
  session:
    executor: claude              # 执行器：fake=内置假进程(自测) / claude=真实 Claude Code
    claude-path: ""               # 空=自动探测全局命令（where claude）
    model: ""
    permission-mode: acceptEdits   # 放手模式；会话级可覆盖
    input-timeout: 300
    idle-timeout: 0
    ring-buffer: 1000
    event-flush-ms: 200
    max-concurrent: 4
  worktree:
    root: ""                       # 空=项目内 .devmind/worktrees
    base-branch: master
  knowledge:
    repo-path: ""                  # 填 knowledge-repo 本地路径后可启用注入
    enabled: true
  docs:
    repo-path: ""                  # 填 docs-repo 本地 git 仓库路径（本机路径写 application-local.yml）
    enabled: true
  project:
    default-path: ""               # 留空：本机路径写在 application-local.yml（DEVMIND_PROJECT_DEFAULT_PATH 亦可覆盖）
    default-name: "default"
    default-tags: []
    workspace-root: "data/repositories"   # CAP-23 克隆工作区根目录：仓库克隆到 <root>/<projectId>/<repo子目录>
  server-adapter:
    crypto-key: ""                 # 凭证加密密钥；空=自动生成存 data/server-crypto.key（gitignored）
    connect-timeout-ms: 15000
    audit-enabled: true
  execution:                     # P0-1 统一执行底座（build/deploy/test/release 共用）
    shell: bash                    # 本地执行 shell（Windows 下为 Git Bash）
    step-timeout-ms: 1800000       # 单步超时 30 分钟，超时 kill
  build:
    default-concurrency: 1         # 新建构建配置的默认并发上限
