# Dev-Mind 分发包配置。
# 只列常用项；未列出的配置使用 jar 内置默认值（外置文件优先级更高，按 key 覆盖）。
# 本机覆盖也可放同目录 application-local.yml（profile 默认 local，自动加载、优先级更高）。

server:
  port: 8080                # 服务端口（改端口后 bin/dev-mind 的健康探测会自动跟随；也可用 DEVMIND_PORT 环境变量指定）

devmind:
  error:
    include-stacktrace: true   # 错误响应体是否附带异常堆栈；仅排错时临时开 true，用完改回
  auth:
    admin-password: admin123   # 初始管理员密码（仅首次种子 admin 时读取；请登录后立即修改）
    access-ttl: 2h             # access token 有效期
    refresh-ttl: 14d           # refresh token 有效期
  session:
    # CAP-34：服务端零执行——无 executor/claude-path；会话由 runner 执行（bin/dev-mind-agent，
    # 配置 config/agent.properties），务必到 后台 → Agent 节点 设默认节点
    model: ""                  # 空=claude 默认模型
    permission-mode: acceptEdits
    max-concurrent: 4          # 最大并发会话数
  worktree:
    base-branch: master        # 会话 worktree 基准分支
  project:
    workspace-root: "data/repositories"   # CAP-23 克隆工作区根目录（跟随启动目录；服务器部署可改绝对路径）
  execution:
    shell: bash                # 本地构建/部署步骤的 shell（Windows 下为 Git Bash）
    step-timeout-ms: 1800000   # 单步超时 30 分钟，超时 kill

# 数据库默认 H2 文件库（./data/devmind，跟随启动目录）；驱动已随包携带，切 MySQL/PostgreSQL 时覆盖：
# spring:
#   datasource:
#     url: jdbc:mysql://host:3306/devmind?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
#     driver-class-name: com.mysql.cj.jdbc.Driver
#     username: ...
#     password: ...
# PostgreSQL 同理（url: jdbc:postgresql://host:5432/devmind，driver-class-name: org.postgresql.Driver），
# 驱动亦随包携带；注意 PG 需提前手工建库（无 createDatabaseIfNotExist 机制）。
